services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    # Install deps from the mounted lockfile, then start the Vite dev server.
    # Vite needs --host 0.0.0.0 to be reachable from the preview proxy.
    command: ["sh", "-ec", "npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview proxy can reach the dev server.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)throw 1}).catch(()=>{process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
